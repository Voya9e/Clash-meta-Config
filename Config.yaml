# mihomo (Clash Meta) 懒人配置
# 版本 V1.23-251221
# https://gist.github.com/liuran001/5ca84f7def53c70b554d3f765ff86a33
# https://obdo.cc/meta
# 作者: 笨蛋ovo (bdovo.cc)
# Telegram: https://t.me/baka_not_baka
# 关注我的 Telegram 频道谢谢喵 https://t.me/s/BDovo_Channel
# 修改自官方示例规则 https://wiki.metacubex.one/example/#meta
# 转载请保留此注释
# 尽量添加了较为详尽的注释，不理解的地方建议对照 虚空终端 (Clash Meta) Docs 进行理解
# 虚空终端 (Clash Meta) Docs 地址: https://wiki.metacubex.one
# 不理解的地方不要乱动，如果你是小白，请按下 `Ctrl + F` 搜索 `基础配置`，只修改此部分

# 推荐使用 https://github.com/vernesong/mihomo/releases 魔改版 Mihomo
# 支持 Smart 策略组，与 Surge 的 Smart 策略组功能大致相似，可以提供更加稳定的节点自动选择策略
# 参见 Smart Core 工作原理详解 https://clashparty.org/docs/guide/smart-core-principles
# 按下 `Ctrl + F` 搜索 `Smart 内核专属设置`

# true 是启用
# false 是禁用

# Smart 内核 LightGBM 模型自动更新开关；true 启用，false 禁用
lgbm-auto-update: true
# LightGBM 模型自动更新间隔，单位为小时
lgbm-update-interval: 72
# LightGBM 模型下载地址；留空时使用内核默认地址
lgbm-url: ""

# 分组
pr:
  &pr {
    type: select,
    proxies:
      [
        自动选择,
        DIRECT,
        香港,
        台湾,
        韩国,
        日本,
        新加坡,
        美国,
        👉香港,
        👉台湾,
        👉韩国,
        👉日本,
        👉新加坡,
        👉美国,
        其它地区,
      ],
  }
# 延迟检测 URL
pp: &p
  type: http
  # 自动更新订阅时间，单位为秒
  interval: 3600
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    # 节点连通性检测时间，单位为秒
    interval: 300
    # 节点超时延迟，单位为毫秒
    timeout: 1000
    # 节点自动切换差值，单位为毫秒
    tolerance: 100
  # 替代已移除的全局指纹，仅对支持 uTLS 的订阅节点设置随机指纹
  override:
    override-expr:
      - '. |= (select(.type == "vmess" or .type == "vless" or .type == "trojan" or .type == "anytls") | .client-fingerprint = "random")'

# 基础配置
# --------------------------------------------------
# 如果你是小白，那么你只需要修改分割线以内的内容
# 其他部分保持不动即可

# 也可以把分割线以内的内容粘贴到您使用代理工具的「覆写」功能，然后在覆写中进行修改
# 使用覆写时可以直接将此配置文件作为订阅链接进行订阅
# https://ghfast.top/https://gist.githubusercontent.com/liuran001/5ca84f7def53c70b554d3f765ff86a33/raw/config.yaml
# 但我们更建议自行修改配置文件而非进行覆写，自行修改后使用更为稳定
# 且我们并不会经常性的对配置文件进行改动
# 你可以在 https://gist.github.com/liuran001/5ca84f7def53c70b554d3f765ff86a33/revisions 查看配置文件改动记录

# 如果你需要使用大于两个机场，在下方 `use` 处添加 `订阅三` （名字可以自己取），然后在 `proxy-providers` 照例添加订阅链接即可
# 反之，如果你只需要使用一个，那么将 `订阅二` 前添加 `#` 进行注释即可

# 订阅名，记得修改成自己的
# 添删订阅在这里和下方订阅链接依葫芦画瓢就行
use: &use
  # 统一控制自动测速组类型；OpenClash 开启 Smart 自动切换后会将 url-test 转为 smart
  type: url-test
  # url-test 切换容差，单位为毫秒
  tolerance: 2
  # 使用 LightGBM 模型预测节点权重
  uselightgbm: true
  # 优先查询 ASN 信息，辅助判断节点所属网络
  prefer-asn: true
  # 收集连接表现数据用于模型训练；关闭时不主动采集
  collectdata: false
  # 数据采样比例，范围 0–1；仅 collectdata 启用时生效
  sample-rate: 1
  # 策略优先级权重规则，格式为“匹配文本或正则:系数”，多条规则用分号分隔；留空不设置额外权重
  policy-priority: ""
  use:
    - A
    - B
#    - 本地配置

# 订阅链接
# 对于订阅来说，path 为选填项，但建议启用
# 本地配置可以只填 path
proxy-providers:
  A:
    <<: *p
    path: ./proxy_provider/A.yaml
    url: ""

  B:
    <<: *p
    path: ./proxy_provider/B.yaml
    url: ""

#  本地配置:
#    <<: *p
#    path: ./proxy_provider/本地配置.yaml

# 规则订阅
rule-providers:
  # 秋风广告拦截规则
  # https://awavenue.top
  # 由于 Anti-AD 误杀率高，本项目已在 1.11-241024 版本更换秋风广告规则
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: yaml
    # path可为空(仅限clash.meta 1.15.0以上版本)
    path: ./rule_provider/AWAvenue-Ads.yaml
    url: "https://ghfast.top/https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    interval: 600
  # Apple 细分规则（Sukka Ruleset）
  AppleIntelligence:
    type: http
    behavior: classical
    format: text
    path: ./rule_provider/AppleIntelligence.txt
    url: https://ruleset.skk.moe/Clash/non_ip/apple_intelligence.txt
    interval: 86400
  AppleCN:
    type: http
    behavior: classical
    format: text
    path: ./rule_provider/AppleCN.txt
    url: https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt
    interval: 86400
  AppleServices:
    type: http
    behavior: classical
    format: text
    path: ./rule_provider/AppleServices.txt
    url: https://ruleset.skk.moe/Clash/non_ip/apple_services.txt
    interval: 86400
  AppleCDN:
    type: http
    behavior: domain
    format: text
    path: ./rule_provider/AppleCDN.txt
    url: https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt
    interval: 86400
  iCloudPrivateRelay:
    type: http
    behavior: domain
    format: text
    path: ./rule_provider/iCloudPrivateRelay.txt
    url: https://ruleset.skk.moe/Clash/domainset/icloud_private_relay.txt
    interval: 86400

mode: rule
# ipv6 支持
ipv6: true
log-level: info
# 允许局域网连接
allow-lan: true
# socks5/http 端口
mixed-port: 7890
# Meta 内核特性 https://wiki.metacubex.one/config/general
# 统一延迟
# 更换延迟计算方式,去除握手等额外延迟
unified-delay: true
# TCP 并发
# 同时对所有ip进行连接，返回延迟最低的地址
tcp-concurrent: true
# 外部控制端口
external-controller: :9090

geodata-mode: true

# Geo 数据库下载地址
# 使用 FastGit 代理 (https://fgit.cf)
# 源地址 https://github.com/MetaCubeX/meta-rules-dat
# 可以更换镜像站但不要更换其他数据库，可能导致无法启动
geox-url:
  geoip: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# 进程匹配模式
# 路由器上请设置为 off
# always 开启，强制匹配所有进程
# strict 默认，由 Clash 判断是否开启
# off 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

# 缓解移动设备耗电问题
# https://github.com/vernesong/OpenClash/issues/2614
keep-alive-interval: 1800


# 缓存
profile:
  store-selected: true
  store-fake-ip: true
  # Smart 数据采集文件最大大小，单位为 MB；仅 collectdata 启用时使用
  smart-collector-size: 100

# 自动同步时间以防止时间不准导致无法正常联网
ntp:
  enable: true
  # 是否同步至系统时间，需要 root/管理员权限
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

# 域名嗅探
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# tun 模式
tun:
  enable: false  # enable 'true'
  stack: system  # or 'gvisor'
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

# dns 设置
# 已配置 ipv6
dns:
  enable: true
  listen: :1053
  ipv6: true
  # 路由器个人建议使用 redir-host 以最佳兼容性
  # 其他设备可以使用 fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - '*'
    - '+.lan'
    - '+.local'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - '[2402:4e00::]'
    - '[2400:3200::1]'
  nameserver:
    # 单引号部分为DoT通过“自动选择”节点代理查询，代理后出现。示例：'tls://8.8.4.4#自动选择'
    - 'tls://8.8.4.4#自动选择'
    - 'tls://1.0.0.1#自动选择'
    - 'tls://[2001:4860:4860::8844]#自动选择'
    - 'tls://[2606:4700:4700::1001]#自动选择'
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: false

  #clash-meta内核使用
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
  
  #stash报错请注释掉上面的nameserver-policy，并使用下面的nameserver-policy
  #nameserver-policy:
  #  'geosite:cn,private': https://223.5.5.5/dns-query#h3=true https://223.6.6.6/dns-query#h3=true

