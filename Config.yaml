# mihomo (Clash Meta) 懒人配置
# 版本 V1.23-251221
# https://gist.github.com/liuran001/5ca84f7def53c70b554d3f765ff86a33
# https://obdo.cc/meta
# 作者: 笨蛋ovo (bdovo.cc)
# Telegram: https://t.me/baka_not_baka
# 关注我的 Telegram 频道谢谢喵 https://t.me/s/BDovo_Channel
# 修改自官方示例规则 https://wiki.metacubex.one/example/#meta
# 转载请保留此注释
# 尽量添加了较为详尽的注释，不理解的地方建议对照 虚空终端 (Clash Meta) Docs 进行理解
# 虚空终端 (Clash Meta) Docs 地址: https://wiki.metacubex.one
# 不理解的地方不要乱动，如果你是小白，请按下 `Ctrl + F` 搜索 `基础配置`，只修改此部分

# 推荐使用 https://github.com/vernesong/mihomo/releases 魔改版 Mihomo
# 支持 Smart 策略组，与 Surge 的 Smart 策略组功能大致相似，可以提供更加稳定的节点自动选择策略
# 参见 Smart Core 工作原理详解 https://clashparty.org/docs/guide/smart-core-principles
# 按下 `Ctrl + F` 搜索 `Smart 内核专属设置`

# true 是启用
# false 是禁用

# 分组
pr:
  &pr {
    type: select,
    proxies:
      [
        自动选择,
        DIRECT,
        香港,
        台湾,
        韩国,
        日本,
        新加坡,
        美国,
        👉香港,
        👉台湾,
        👉韩国,
        👉日本,
        👉新加坡,
        👉美国,
        其它地区,
      ],
  }
# 延迟检测 URL
pp: &p
  type: http
  # 自动更新订阅时间，单位为秒
  interval: 3600
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    # 节点连通性检测时间，单位为秒
    interval: 300
    # 节点超时延迟，单位为毫秒
    timeout: 1000
    # 节点自动切换差值，单位为毫秒
    tolerance: 100

# 基础配置
# --------------------------------------------------
# 如果你是小白，那么你只需要修改分割线以内的内容
# 其他部分保持不动即可

# 也可以把分割线以内的内容粘贴到您使用代理工具的「覆写」功能，然后在覆写中进行修改
# 使用覆写时可以直接将此配置文件作为订阅链接进行订阅
# https://ghfast.top/https://gist.githubusercontent.com/liuran001/5ca84f7def53c70b554d3f765ff86a33/raw/config.yaml
# 但我们更建议自行修改配置文件而非进行覆写，自行修改后使用更为稳定
# 且我们并不会经常性的对配置文件进行改动
# 你可以在 https://gist.github.com/liuran001/5ca84f7def53c70b554d3f765ff86a33/revisions 查看配置文件改动记录

# 如果你需要使用大于两个机场，在下方 `use` 处添加 `订阅三` （名字可以自己取），然后在 `proxy-providers` 照例添加订阅链接即可
# 反之，如果你只需要使用一个，那么将 `订阅二` 前添加 `#` 进行注释即可

# 订阅名，记得修改成自己的
# 添删订阅在这里和下方订阅链接依葫芦画瓢就行
use: &use
  # 如果不希望自动切换请将 `type: url-test` 更换为 `type: select`
  type: url-test
  # --- Smart 内核专属设置
  # 把上面那行 `type` 删掉
  #type: smart
  # 下方为 Smart 内核高级设置，如果不懂则不要启用，只切换 `type: smart` 即可
  # policy-priority: <1 表示更低优先级，>1 表示更高优先级，默认值为 1，匹配规则支持正则表达式和字符串
  #policy-priority: "Premium:0.9;SG:1.3" 
  # uselightgbm: 使用 LightGBM 模型预测权重
  #uselightgbm: false
  # collectdata: 收集数据用于模型训练
  #collectdata: false
  # sample-rate: 数据采集率，可取 0-1 之间的值，默认值为 1
  #sample-rate: 1
  # prefer-asn: 节点选择时强制优先查询 ASN，默认值为 false
  #prefer-asn: true
  # --- Smart 内核专属设置结束
  use:
    - A
    - B
#    - 本地配置

# 订阅链接
# 对于订阅来说，path 为选填项，但建议启用
# 本地配置可以只填 path
proxy-providers:
  A:
    <<: *p
    path: ./proxy_provider/A.yaml
    url: ""

  B:
    <<: *p
    path: ./proxy_provider/B.yaml
    url: ""

#  本地配置:
#    <<: *p
#    path: ./proxy_provider/本地配置.yaml

# 规则订阅
rule-providers:
  # 秋风广告拦截规则
  # https://awavenue.top
  # 由于 Anti-AD 误杀率高，本项目已在 1.11-241024 版本更换秋风广告规则
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: yaml
    # path可为空(仅限clash.meta 1.15.0以上版本)
    path: ./rule_provider/AWAvenue-Ads.yaml
    url: "https://ghfast.top/https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    interval: 600
  GAME:
    type: http
    behavior: classical
    format: yaml
    # path可为空(仅限clash.meta 1.15.0以上版本)
    path: ./rule_provider/GAME.yaml
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Game/Game.yaml"
    interval: 600

mode: rule
# ipv6 支持
ipv6: true
log-level: info
# 允许局域网连接
allow-lan: true
# socks5/http 端口
mixed-port: 7890
# Meta 内核特性 https://wiki.metacubex.one/config/general
# 统一延迟
# 更换延迟计算方式,去除握手等额外延迟
unified-delay: true
# TCP 并发
# 同时对所有ip进行连接，返回延迟最低的地址
tcp-concurrent: true
# 外部控制端口
external-controller: :9090

geodata-mode: true

# Geo 数据库下载地址
# 使用 FastGit 代理 (https://fgit.cf)
# 源地址 https://github.com/MetaCubeX/meta-rules-dat
# 可以更换镜像站但不要更换其他数据库，可能导致无法启动
geox-url:
  geoip: "https://hub.gitmirror.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://hub.gitmirror.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://hub.gitmirror.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# 进程匹配模式
# 路由器上请设置为 off
# always 开启，强制匹配所有进程
# strict 默认，由 Clash 判断是否开启
# off 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

# 缓解移动设备耗电问题
# https://github.com/vernesong/OpenClash/issues/2614
keep-alive-interval: 1800

# 全局客户端指纹
global-client-fingerprint: random # 随机指纹

# 缓存
profile:
  store-selected: true
  store-fake-ip: true

# 自动同步时间以防止时间不准导致无法正常联网
ntp:
  enable: true
  # 是否同步至系统时间，需要 root/管理员权限
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 30

# 域名嗅探
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# tun 模式
tun:
  enable: false  # enable 'true'
  stack: system  # or 'gvisor'
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

# dns 设置
# 已配置 ipv6
dns:
  enable: true
  listen: :1053
  ipv6: true
  # 路由器个人建议使用 redir-host 以最佳兼容性
  # 其他设备可以使用 fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - '*'
    - '+.lan'
    - '+.local'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - '[2402:4e00::]'
    - '[2400:3200::1]'
  nameserver:
    # 单引号部分为DoT通过“自动选择”节点代理查询，代理后出现。示例：'tls://8.8.4.4#自动选择'
    - 'tls://8.8.4.4#自动选择'
    - 'tls://1.0.0.1#自动选择'
    - 'tls://[2001:4860:4860::8844]#自动选择'
    - 'tls://[2606:4700:4700::1001]#自动选择'
  proxy-server-nameserver:
    - https://doh.pub/dns-query

  #clash-meta内核使用
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
  
  #stash报错请注释掉上面的nameserver-policy，并使用下面的nameserver-policy
  #nameserver-policy:
  #  'geosite:cn,private': https://223.5.5.5/dns-query#h3=true https://223.6.6.6/dns-query#h3=true

